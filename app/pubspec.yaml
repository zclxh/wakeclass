name: wakeclass_app
description: 醒课 —— 支持截图 OCR 导入的大学课程表 App（Flutter 版）。
publish_to: 'none'
version: 0.3.6+17

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # 核心领域逻辑（纯 Dart，路径依赖同一仓库）
  wakeclass_core:
    path: ../packages/wakeclass_core
  # 端上 OCR（Android / iOS）
  google_mlkit_text_recognition: ^0.13.0
  # 相册选图 / 拍照
  image_picker: ^1.1.2
  # 本地 JSON 存储
  shared_preferences: ^2.3.2
  # 日期格式化
  intl: ^0.19.0
  # 教务系统直连（HTTP，全平台可用）
  http: ^1.2.2
  # 课表 HTML 解析（纯 Dart，全平台可用）
  html: ^0.15.4
  # CAS 统一认证密码加密（AES-CBC）
  pointycastle: ^3.9.1
  # URP 教务页面 GBK 解码
  fast_gbk: ^1.0.0
  # 本地通知（课前提醒）
  flutter_local_notifications: ^19.0.0
  # 通知调度的时区支持
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
